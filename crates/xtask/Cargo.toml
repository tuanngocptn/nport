[package]
name = "xtask"
version = "0.0.0"
description = "Repository automation for NPort: codegen, fixtures, npm packages, doc checks."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# `clap` for the `CommandFactory` walk, `nport` for the `Args` it walks. Together they are what makes
# the generated flag reference exact instead of parsed (`src/codegen.rs`).
clap = { workspace = true }
nport = { workspace = true }
serde_json = { workspace = true }
