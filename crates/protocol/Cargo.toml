[package]
name = "nport-protocol"
version = "3.0.0-dev"
description = "Cloudflare Tunnel connector wire protocol, implemented natively in Rust."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Flipped in Phase 3, when there is something worth publishing (docs/RELEASE.md).
publish = false

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
capnp = { workspace = true }
capnp-futures = { workspace = true }
capnp-rpc = { workspace = true }
futures = { workspace = true }
hickory-resolver = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# **Dev-only, and only for the examples.** `crates/core` owns the real origin-side proxy, so the
# spike calls it rather than keeping a second copy that could drift from the one under test. This is
# a dev-dependency cycle (core depends on protocol), which Cargo permits and which does not appear in
# `nport-protocol`'s library dependency graph — the one-way layering in `crates/CLAUDE.md` is about
# the libraries, not about throwaway scaffolding. If this ever appears outside `[dev-dependencies]`,
# that IS the regression.
nport-core = { workspace = true }
# Snapshots of every wire encoder (docs/TESTING.md, and rule 4 in CLAUDE.md).
insta = { workspace = true }
# Only the spike's echo origin and its `ws_client` driver use these. Nothing under `src/`
# may — the connector pipes WebSocket bytes without interpreting them (docs/PROTOCOL.md §11),
# and a WebSocket library in the connector would be a sign that invariant has been broken.
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true }

[build-dependencies]
capnpc = { workspace = true }
