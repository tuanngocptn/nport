[package]
name = "nport-core"
version = "3.0.0-dev"
description = "Headless NPort tunnel lifecycle: provision, connect, proxy, teardown."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Flipped in Phase 3, when there is something worth publishing (docs/RELEASE.md).
publish = false

[lints]
workspace = true

[dependencies]
# Layering is one-directional: protocol → core → { cli, desktop }, contract → core.
# A `nport` (cli) entry here is the architectural regression to watch for.
nport-contract = { workspace = true }
nport-protocol = { workspace = true }
# The connector dials QUIC itself. `crates/protocol` owns the wire; the connection object it
# hands back is quinn's, so this is the same dependency seen from one layer up.
quinn = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Test scaffolding only. `crates/core` never encodes a Cap'n Proto message in production — that is
# `crates/protocol`'s job — but `exchange`'s tests have to play the edge, and decoding the response
# the connector wrote is the only way to assert what it actually said.
capnp = { workspace = true }
