[workspace]
resolver = "3"
members = [
  "crates/cli",
  "crates/contract",
  "crates/core",
  "crates/protocol",
  "crates/xtask",
  # "apps/desktop/src-tauri" joins in Phase 4 (apps/desktop/CLAUDE.md rule 1).
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/tuanngocptn/nport"
homepage = "https://nport.link"
authors = ["Nick Pham <tuanngocptn@gmail.com>"]

# A crate that forgets `#![forbid(unsafe_code)]` is still covered, as long as it
# inherits with `[lints] workspace = true` (docs/conventions/rust.md).
[workspace.lints.rust]
unsafe_code = "forbid"

# Declared once here, referenced as `{ workspace = true }`. Adding a dependency to a
# crate without adding it here first will drift versions (docs/conventions/rust.md).
# Every entry below is a crate the design already commits to; nothing speculative.
[workspace.dependencies]
anyhow = "1.0"
base64 = "0.23"
capnp = "0.27"
capnp-futures = "0.27"
capnp-rpc = "0.27"
capnpc = "0.27"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
futures = "0.3"
h2 = "0.4"
# DoT feature selection depends on the crypto provider chosen below — Phase 1.
hickory-resolver = "0.26"
insta = "1.48"
proptest = "1.11"
# aws-lc-rs, not quinn's default ring: offering X25519MLKEM768 requires it, and rustls
# 0.23's own default features pair aws-lc-rs with `prefer-post-quantum` — which is
# precisely cloudflared's PostQuantumPrefer default (docs/PROTOCOL.md §5).
# Watch this at release time: the two musl targets are where aws-lc-rs linkage bites
# (docs/RELEASE.md).
quinn = { version = "0.11", default-features = false, features = [
  "log",
  "runtime-tokio",
  "rustls-aws-lc-rs",
  "bloom",
] }
rustls = "0.23"
# System roots, mirroring upstream's x509.SystemCertPool(). Not rustls-platform-verifier:
# the edge presents a Cloudflare Origin CA certificate, and a platform verifier cannot be
# extended with the extra roots that requires (docs/PROTOCOL.md §5).
rustls-native-certs = "0.8"
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "macros",
  "signal",
  "time",
] }
tokio-util = { version = "0.7", features = ["compat"] }
uuid = { version = "1.24", features = ["v4", "serde"] }
zeroize = { version = "1.9", features = ["derive"] }

# Internal crates, by path.
nport-contract = { path = "crates/contract" }
nport-core = { path = "crates/core" }
nport-protocol = { path = "crates/protocol" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# `panic` is left at "unwind" on purpose: apps/desktop links crates/core in-process,
# and a panic that aborts takes the whole GUI down with no dialog (crates/CLAUDE.md).
