[workspace]
resolver = "3"
members = [
  "crates/cli",
  "crates/contract",
  "crates/core",
  "crates/protocol",
  "crates/xtask",
  # Scaffolded early so `pnpm dev` can bring every surface up at once. The *app* is still Phase 4
  # (apps/desktop/CLAUDE.md rule 1): this member is a window and one IPC command, and deliberately
  # does not depend on `nport-core` yet — that edge is what Phase 4 waits for a stable core to add.
  "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/tuanngocptn/nport"
homepage = "https://nport.link"
authors = ["Nick Pham <tuanngocptn@gmail.com>"]

# A crate that forgets `#![forbid(unsafe_code)]` is still covered, as long as it
# inherits with `[lints] workspace = true` (docs/conventions/rust.md).
[workspace.lints.rust]
unsafe_code = "forbid"

# Declared once here, referenced as `{ workspace = true }`. Adding a dependency to a
# crate without adding it here first will drift versions (docs/conventions/rust.md).
# Every entry below is a crate the design already commits to; nothing speculative.
[workspace.dependencies]
anyhow = "1.0"
# Not a new stack: rustls already pulls this in, and using its SHA-256 for proof of work keeps a
# second hash implementation out of the binary (ADR-0029).
aws-lc-rs = "1.17"
base64 = "0.23"
capnp = "0.27"
capnp-futures = "0.27"
capnp-rpc = "0.27"
capnpc = "0.27"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
futures = "0.3"
h2 = "0.4"
# DoT feature selection depends on the crypto provider chosen below — Phase 1.
# `tls-aws-lc-rs`, not `tls-ring`, and not for style: `docs/PROTOCOL.md` §4's DoT fallback needs a
# TLS-capable resolver, and hickory's ring variant would pull a *second* rustls crypto provider
# alongside the aws-lc-rs one this workspace pins for X25519MLKEM768. rustls then refuses to pick one
# **at runtime** rather than at compile time — the same trap `tokio-rustls` and `tokio-tungstenite`
# are argued down for below.
hickory-resolver = { version = "0.26", features = ["tls-aws-lc-rs"] }
# NFKC for the subdomain mirror in `crates/contract`, and **already in this binary's graph** —
# `hickory-resolver` → `idna` → `idna_adapter` → `icu_normalizer`. So this declares something the
# CLI already links: `Cargo.lock` gains one line and no new package. `unicode-normalization` would
# have been the reflexive choice and it is the worse one — a second copy of the normalization tables
# in a binary that ships eight platform packages, to compute the same answer. Licence is Unicode-3.0,
# already on `deny.toml`'s allowlist for the same transitive reason. ADR-0045.
#
# **`default-features = false` is load-bearing, not tidiness.** The defaults add `utf16_iter` and
# `write16` for normalizing UTF-16 in place, which nothing here does — checked by reading the lockfile
# diff rather than assumed, because the first version of this line claimed "no new crate" while adding
# two. `compiled_data` is the one feature needed, and it is what makes `new_nfkc()` a `const fn` with
# no initialisation to pay for.
icu_normalizer = { version = "2.1", default-features = false, features = ["compiled_data"] }
insta = "1.48"
proptest = "1.11"
# aws-lc-rs, not quinn's default ring: offering X25519MLKEM768 requires it, and rustls
# 0.23's own default features pair aws-lc-rs with `prefer-post-quantum` — which is
# precisely cloudflared's PostQuantumPrefer default (docs/PROTOCOL.md §5).
# Watch this at release time: the two musl targets are where aws-lc-rs linkage bites
# (docs/RELEASE.md).
quinn = { version = "0.11", default-features = false, features = [
  "log",
  "runtime-tokio",
  "rustls-aws-lc-rs",
  "bloom",
] }
rustls = "0.23"
# System roots, mirroring upstream's x509.SystemCertPool(). Not rustls-platform-verifier:
# the edge presents a Cloudflare Origin CA certificate, and a platform verifier cannot be
# extended with the extra roots that requires (docs/PROTOCOL.md §5).
rustls-native-certs = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# apps/desktop. The JS half is pinned in pnpm-workspace.yaml's catalog; these two must stay in step
# with `@tauri-apps/cli`, because the CLI generates and validates the config this crate compiles.
tauri = { version = "2.11", features = ["macos-private-api"] }
tauri-build = { version = "2.6", features = [] }
tauri-plugin-opener = "2.5"
thiserror = "2.0"
# `~/.nport/config.toml`, whose format `crates/CLAUDE.md` rule 8 already settled. Parsing only.
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
tokio = { version = "1.53", features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "macros",
  "signal",
  "time",
  # Channels. `crates/core` confines `capnp-rpc`'s non-`Send` region behind a thread boundary
  # (ADR-0024), and channels are what the two sides talk over.
  "sync",
] }
tokio-util = { version = "0.7", features = ["compat"] }
# Test scaffolding only, and it must stay that way: the connector never speaks WebSocket
# itself — it pipes opaque bytes (docs/PROTOCOL.md §11). These exist so the spike can be an
# echo origin and a real client, which is what G1 criterion 3 asks for. `default-features`
# is off to keep tungstenite's own TLS out: it would pull a second rustls crypto provider
# alongside aws-lc-rs and rustls then refuses to pick one.
tokio-rustls = { version = "0.26", default-features = false, features = [
  "aws-lc-rs",
  "tls12",
  "logging",
] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
  "handshake",
] }
uuid = { version = "1.24", features = ["v4", "serde"] }
zeroize = { version = "1.9", features = ["derive"] }

# Internal crates, by path.
# `version` alongside `path` is not decoration. Path-only is a wildcard requirement, which
# `deny.toml` refuses under `[bans] wildcards` — and the refusal only surfaced once these were
# genuinely depended on rather than merely declared. Publishing to crates.io in Phase 3 requires
# both fields anyway (`docs/RELEASE.md`), so this is the fix that does not weaken a check.
nport-contract = { path = "crates/contract", version = "3.0.0-dev" }
nport-core = { path = "crates/core", version = "3.0.0-dev" }
nport-protocol = { path = "crates/protocol", version = "3.0.0-dev" }
# The CLI, for `crates/xtask` only. It is here so `cargo xtask codegen` can read `Args`'s clap
# definition and generate the flag reference from it rather than from a table someone retypes
# (defect 38). `crates/cli` gained a `lib.rs` for this and nothing else — see its crate docs. This is
# not an edge in the `protocol → core → {cli, desktop}` graph: `xtask` is a build tool, not a
# consumer, and the direction that would be a regression is `core → cli`.
nport = { path = "crates/cli", version = "3.0.0-dev" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# `panic` is left at "unwind" on purpose: apps/desktop links crates/core in-process,
# and a panic that aborts takes the whole GUI down with no dialog (crates/CLAUDE.md).
